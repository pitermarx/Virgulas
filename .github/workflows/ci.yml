name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  commit-policy:
    name: Conventional Commit Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Derive commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="${{ github.sha }}"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          else
            LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "$LAST_TAG" ]; then
              RANGE="$LAST_TAG..${{ github.sha }}"
            else
              BASE="$(git rev-parse --short HEAD~20 2>/dev/null || echo "${{ github.sha }}")"
              RANGE="$BASE..${{ github.sha }}"
            fi
          fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Validate Conventional Commit headers
        run: node scripts/check-conventional-commits.mjs --range "${{ steps.range.outputs.range }}"

  test:
    name: E2E Tests (shard ${{ matrix.shard }}/3)
    needs: commit-policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      # The CLI publishes host ports 54321-54329 by default, and that whole range
      # sits inside the Linux ephemeral range (32768-60999). Docker binds every
      # published port explicitly, so any outgoing socket on the runner that
      # happens to hold one of them fails the start with "failed to bind host
      # port ...: address already in use" before a single test runs. Move every
      # published port below the ephemeral range first: the suite resolves the
      # API from `supabase status -o env` and the development CSP allows any
      # loopback port, so nothing else has to change.
      - name: Move local Supabase off the ephemeral port range
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')

          // Section -> the default host ports the CLI publishes for it.
          const ports = {
            api: { port: 32001 },
            db: { port: 32002, shadow_port: 32003 },
            'db.pooler': { port: 32004 },
            studio: { port: 32005 },
            inbucket: { port: 32006 },
            analytics: { port: 32007 },
          }

          const file = 'supabase/config.toml'
          const seen = new Set()
          let section = ''
          const rewritten = fs.readFileSync(file, 'utf8').split('\n').map((line) => {
            const header = /^\s*\[([^\]]+)\]\s*$/.exec(line)
            if (header) {
              section = header[1]
              return line
            }
            const entry = /^(\s*)(port|shadow_port)\s*=\s*(\d+)\s*$/.exec(line)
            const next = entry ? ports[section]?.[entry[2]] : undefined
            if (!next) return line
            seen.add(`${section}.${entry[2]}`)
            return `${entry[1]}${entry[2]} = ${next}`
          }).join('\n')

          // Fail loudly instead of silently starting on the ephemeral defaults.
          const expected = Object.entries(ports).flatMap(([name, values]) =>
            Object.keys(values).map((key) => `${name}.${key}`)
          )
          const missing = expected.filter((key) => !seen.has(key))
          if (missing.length > 0) {
            console.error(`config.toml no longer declares: ${missing.join(', ')}`)
            process.exit(1)
          }

          fs.writeFileSync(file, rewritten)
          console.log('Local Supabase host ports:', JSON.stringify(ports))
          NODE

      # Registry pull limits ("Data limit exceeded") and a container still
      # winding down fail the start the same way. Roll the half-started stack
      # back and retry instead of failing the shard.
      - name: Start local Supabase
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if bun run db:start; then
              echo "Local Supabase started (attempt $attempt)."
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt; cleaning up and retrying"
            bun run db:stop || true
            docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f || true
            docker ps -a --format '{{.Names}} {{.Status}}' | grep '^supabase_' || true
            sleep 15
          done
          echo "::error::Local Supabase failed to start after 3 attempts."
          exit 1

      - name: Run unit tests
        run: bun run test:unit
        env:
          CI: true

      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        run: bun run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Stop local Supabase
        if: always()
        run: bun run db:stop

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  publish-db:
    name: Publish Database Migrations
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT: ${{ vars.SUPABASE_PROJECT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required Supabase secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT" || (echo "Missing SUPABASE_PROJECT" && exit 1)

      - name: Derive project ref
        id: project
        run: |
          PROJECT_REF="$SUPABASE_PROJECT"
          test -n "$PROJECT_REF" || (echo "SUPABASE_PROJECT is empty" && exit 1)
          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"

      - name: Link Supabase project
        run: bunx supabase link --project-ref "${{ steps.project.outputs.project_ref }}"

      - name: Publish latest migrations
        run: bunx supabase db push --linked --include-all

  release:
    name: Publish Release
    needs: [test, publish-db]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.plan.outputs.release_needed }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      resolved_version: ${{ steps.plan.outputs.resolved_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Plan release from commit history
        id: plan
        run: node scripts/release-from-commits.mjs

      - name: Create GitHub Release
        if: steps.plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.plan.outputs.release_tag }}"
          NOTES_FILE="${{ steps.plan.outputs.notes_file }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping publish."
            exit 0
          fi

          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"

      - name: Bump version in package.json and source/version.json
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          VERSION="${{ steps.plan.outputs.resolved_version }}"
          npm version "$VERSION" --no-git-tag-version
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('source/version.json', 'utf8'));
            v.version = process.env.VERSION;
            fs.writeFileSync('source/version.json', JSON.stringify(v, null, 2) + '\n');
          " VERSION="$VERSION"

      - name: Commit version bump
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json source/version.json
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.plan.outputs.resolved_version }} [skip ci]"
          git push

  # Validate the all-in-one Dockerfile on pull requests without publishing.
  validate-image:
    name: Validate container image
    needs: [commit-policy]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=0.0.0-pr \
            -f scripts/trailbase/Dockerfile \
            -t virgulas-trailbase:pr \
            .

      # A build-only check misses runtime failures such as a root-owned depot
      # (issue #105): the image runs as the non-root `trailbase` user and must
      # actually boot and start listening.
      - name: Smoke-test the image
        run: bash scripts/trailbase/smoke-image.sh virgulas-trailbase:pr

  # The all-in-one image: Virgulas served by TrailBase from the same origin.
  # Every main push refreshes latest/main/sha; a release adds its version tag.
  publish-image:
    name: Publish TrailBase image
    needs: [test, release]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # append the pull command to the release notes
      packages: write      # GHCR push
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push multi-arch image
        env:
          VERSION: ${{ needs.release.outputs.resolved_version }}
          RELEASE_NEEDED: ${{ needs.release.outputs.release_needed }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/virgulas-trailbase"

          TAGS=(
            --tag "$IMAGE:latest"
            --tag "$IMAGE:main"
            --tag "$IMAGE:sha-${GITHUB_SHA:0:7}"
          )
          BUILD_VERSION=""
          if [ "$RELEASE_NEEDED" = "true" ] && [ -n "$VERSION" ]; then
            TAGS+=(--tag "$IMAGE:$VERSION")
            BUILD_VERSION="$VERSION"
          fi

          # Load a native-arch image and boot it before publishing to every
          # platform: a build alone does not prove the container can run as its
          # own unprivileged user (issue #105). The multi-arch build below
          # reuses these layers from the BuildKit cache.
          docker buildx build \
            --file scripts/trailbase/Dockerfile \
            --platform linux/amd64 \
            --build-arg APP_VERSION="$BUILD_VERSION" \
            --tag virgulas-trailbase:smoke \
            --load \
            .
          bash scripts/trailbase/smoke-image.sh virgulas-trailbase:smoke

          docker buildx build \
            --file scripts/trailbase/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg APP_VERSION="$BUILD_VERSION" \
            "${TAGS[@]}" \
            --push \
            .

      - name: Add pull command to release notes
        if: ${{ needs.release.outputs.release_needed == 'true' && needs.release.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.release_tag }}
          VERSION: ${{ needs.release.outputs.resolved_version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/virgulas-trailbase"
          BODY="$(gh release view "$TAG" --json body -q .body)"

          if printf '%s' "$BODY" | grep -qF '## Container image'; then
            exit 0
          fi

          {
            printf '%s\n\n' "$BODY"
            printf '## Container image\n\n'
            printf 'Multi-arch (`linux/amd64`, `linux/arm64`):\n\n'
            printf '```bash\ndocker pull %s:%s\n```\n' "$IMAGE" "$VERSION"
          } > /tmp/release-notes.md

          gh release edit "$TAG" --notes-file /tmp/release-notes.md

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, publish-db, release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site bundle
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.release.outputs.resolved_version }}
          # Pins the production CSP connect-src to the real project; falls back to
          # the sync.ts default when the repository variable is not set.
          SUPABASE_PROJECT: ${{ vars.SUPABASE_PROJECT }}
        run: |
          set -euo pipefail

          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('package.json').text()).version)")
          fi

          # Build the app (bundles TS + CSS, stamps version.json and the meta tag).
          # No source maps: the deployed artifact should not carry them.
          bun scripts/build-bun.mjs source dist --version "$APP_VERSION" --no-sourcemap

          if [ -f dist/js/app.js.map ]; then
            echo "Refusing to deploy: source maps were generated"
            exit 1
          fi

          mkdir -p _site
          cp -r dist/. _site/
          echo "Built app version: $APP_VERSION"

      - name: Package dist as a release archive
        id: package
        env:
          APP_VERSION: ${{ needs.release.outputs.resolved_version }}
        run: |
          set -euo pipefail

          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('package.json').text()).version)")
          fi

          ARCHIVE="virgulas-${APP_VERSION}.zip"

          # `zip` ships on the GitHub-hosted Ubuntu image; fail clearly if absent.
          command -v zip >/dev/null 2>&1 || (echo "The 'zip' utility is required (apt install zip)" && exit 1)

          # Zip the *contents* of dist/ (no wrapper directory) so the archive can be
          # extracted directly into a web root. Built from inside dist/ so stored paths
          # are relative (no absolute runner paths) and reproducible across runners.
          # -X omits extra file attributes; source maps are never shipped anyway.
          (cd dist && zip -r -X "../${ARCHIVE}" . -x '*.map')

          test -f "$ARCHIVE" || (echo "Archive was not created" && exit 1)

          # Guard the deploy contract: the archive must be a flat, directly servable site.
          unzip -l "$ARCHIVE" | grep -q ' index.html$' || (echo "Archive is missing index.html at its root" && exit 1)
          if unzip -l "$ARCHIVE" | grep -q '\.map$'; then
            echo "Refusing to package source maps"
            exit 1
          fi

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Packaged $(du -h "$ARCHIVE" | cut -f1) into $ARCHIVE"
          unzip -l "$ARCHIVE"

      - name: Attach archive to the release
        if: needs.release.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ needs.release.outputs.release_tag }}"
          ARCHIVE="${{ steps.package.outputs.archive }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found; skipping asset upload."
            exit 0
          fi

          gh release upload "$TAG" "$ARCHIVE" --clobber
          echo "Attached $ARCHIVE to $TAG"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # upload-pages-artifact v4+ excludes dotfiles (tar --exclude=.[^/]*) for
      # security, which silently drops /.well-known/security.txt and gpc.json.
      # The spec requires those paths, so opt back in (.git/.github stay excluded).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # GitHub Pages cannot set response headers; the required-tier headers
      # (HSTS, nosniff, frame-ancestors, Referrer-Policy, Permissions-Policy) are
      # applied at the Cloudflare edge. This must fail the deploy: a silently
      # skipped ruleset is how the clickjacking/HSTS gap came back before.
      # The token needs Zone → Zone Settings → Edit (Always Use HTTPS) and
      # Zone → Transform Rules → Edit (the response-header ruleset).
      - name: Apply Cloudflare edge headers
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run cf:headers

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets not set; skipping cache purge."
            exit 0
          fi

          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache"
